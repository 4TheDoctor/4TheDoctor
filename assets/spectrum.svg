<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="4" viewBox="0 0 1200 4" preserveAspectRatio="none" role="presentation">
  <defs>
    <style>
      .drift { animation: drift 14s linear infinite; }
      @keyframes drift {
        0%   { transform: translateX(0); }
        100% { transform: translateX(-1200px); }
      }
      @media (prefers-reduced-motion: reduce) { .drift { animation: none; } }
    </style>
    <linearGradient id="spec" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0.000" stop-color="#00FF9F" />
      <stop offset="0.083" stop-color="#00D4FF" />
      <stop offset="0.166" stop-color="#0055FF" />
      <stop offset="0.250" stop-color="#8833FF" />
      <stop offset="0.333" stop-color="#FF2D20" />
      <stop offset="0.416" stop-color="#FF6B00" />
      <stop offset="0.500" stop-color="#00FF9F" />
      <stop offset="0.583" stop-color="#00D4FF" />
      <stop offset="0.666" stop-color="#0055FF" />
      <stop offset="0.750" stop-color="#8833FF" />
      <stop offset="0.833" stop-color="#FF2D20" />
      <stop offset="0.916" stop-color="#FF6B00" />
      <stop offset="1.000" stop-color="#00FF9F" />
    </linearGradient>
  </defs>
  <rect class="drift" x="0" y="0" width="2400" height="4" fill="url(#spec)" />
</svg>
